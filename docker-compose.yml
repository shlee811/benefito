services:
  benefito-db:
    image: pgvector/pgvector:pg16
    container_name: benefito-db
    environment:
      POSTGRES_DB: benefito
      POSTGRES_USER: benefito
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  benefito-redis:
    image: redis:7-alpine
    container_name: benefito-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

volumes:
  pgdata:
  redisdata: