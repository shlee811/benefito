spring:
  application:
    name: benefito-backend

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:benefito}
    username: ${DB_USERNAME:benefito}
    password: ${DB_PASSWORD:benefito123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  jwt:
    secret: ${JWT_SECRET_KEY}
    token:
      access-expiration-time: ${JWT_ACCESS_EXPIRATION}
      refresh-expiration-time: ${JWT_REFRESH_EXPIRATION}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

openai:
  base-url: https://api.openai.com
  api-key: ${OPENAI_API_KEY}
  embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
  chat-model: ${OPENAI_CHAT_MODEL:gpt-4.1-mini}

external:
  # 관리자 인증이 아직 없어 개발 환경에서만 true로 켜서 사용하는 수동 수집 API 게이트.
  admin-api:
    enabled: ${EXTERNAL_ADMIN_API_ENABLED:false}
  kstartup:
    base-url: https://apis.data.go.kr/B552735/kisedKstartupService01
    api-key: ${KSTARTUP_API_KEY:}
    per-page: 100
    # 실행 1회당 최대로 조회할 페이지 수. totalCount 기준으로도 조기 종료하지만, 이 값이 수집 범위의 상한이다.
    max-pages: 5
    scheduler:
      enabled: false
      cron: "0 0 3 * * *"
  public-institution-job:
    base-url: https://apis.data.go.kr/1051000/recruitment
    api-key: ${PUBLIC_INSTITUTION_JOB_API_KEY:}
    num-of-rows: 100
    # 실행 1회당 최대로 조회할 페이지 수. 전체 건수(totalCount)가 매우 커서(11만건 이상) 상한이 특히 중요하다.
    max-pages: 5
  qnet:
    base-url: http://openapi.q-net.or.kr/api/service/rest
    api-key: ${QNET_API_KEY:}
    # 종목 목록(jmCd) 중 시험일정을 실제로 수집할 대상만 지정한다(getJMList는 jmCd 없이 전체 조회가 불가능).
    # 1320 = 정보처리기사. 필요한 종목코드를 이 목록에 추가하면 코드 변경 없이 수집 대상이 늘어난다.
    target-codes:
      - "1320"