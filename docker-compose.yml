services:
  benefito-backend:
    image: ${DOCKER_IMAGE_NAME}:latest
    container_name: benefito-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - benefito-redis
    restart: unless-stopped

  benefito-redis:
    image: redis:7-alpine
    container_name: benefito-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

volumes:
  redisdata: